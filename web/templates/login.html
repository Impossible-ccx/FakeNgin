{% extends "base.html" %}

{% block title %}FakeNgin · 账户登录{% endblock %}

{% block content %}
<section class="login-wrap">
    <form class="login-card" method="post" action="{{ url_for('main.login', next=request.args.get('next')) }}">
        <span class="login-mark" aria-hidden="true">
            <svg viewBox="0 0 28 28" fill="none"><path d="M6 21V7h16M6 14h11" stroke="currentColor" stroke-width="3.2" stroke-linecap="round"/><circle cx="21" cy="21" r="3" fill="currentColor"/></svg>
        </span>
        <h2>账户登录</h2>
        <p class="login-desc">请使用管理员分配的账户登录。</p>

        {% if error %}
        <div class="alert">{{ error }}</div>
        {% endif %}

        <label class="field">
            <span>账户</span>
            <input type="text" name="username" value="{{ username }}" autocomplete="username" required>
        </label>

        <label class="field">
            <span>密码</span>
            <input type="password" name="password" autocomplete="current-password" required>
        </label>

        <button class="btn btn-primary btn-block" type="submit">登录</button>
    </form>
</section>
{% endblock %}
