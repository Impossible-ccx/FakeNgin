{% extends "base.html" %}

{% block title %}FakeNgin · 账户登录{% endblock %}

{% block content %}
<section class="login-wrap">
    <form class="login-card" method="post" action="{{ url_for('main.login', next=request.args.get('next')) }}">
        <h2>账户登录</h2>
        <p class="login-desc">请使用管理员分配的账户登录。</p>

        {% if error %}
        <div class="alert">{{ error }}</div>
        {% endif %}

        <label class="field">
            <span>账户</span>
            <input type="text" name="username" value="{{ username }}" autocomplete="username" required>
        </label>

        <label class="field">
            <span>密码</span>
            <input type="password" name="password" autocomplete="current-password" required>
        </label>

        <button class="btn btn-primary btn-block" type="submit">登录</button>
    </form>
</section>
{% endblock %}
