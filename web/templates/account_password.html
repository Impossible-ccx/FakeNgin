{% extends "base.html" %}

{% block title %}FakeNgin · 修改密码{% endblock %}

{% block content %}
<section class="login-wrap">
    <form class="login-card" method="post" action="{{ url_for('main.account_password') }}">
    <input type="hidden" name="_csrf_token" value="{{ csrf_token }}">
        <h2>修改密码</h2>
        <p class="login-desc">当前账户：{{ user.username }}（{{ user.role }}）</p>

        <label class="field">
            <span>原密码</span>
            <input type="password" name="current_password" autocomplete="current-password" required>
        </label>
        <label class="field">
            <span>新密码（至少 8 位）</span>
            <input type="password" name="new_password" autocomplete="new-password" minlength="8" required>
        </label>
        <label class="field">
            <span>确认新密码</span>
            <input type="password" name="confirm_password" autocomplete="new-password" minlength="8" required>
        </label>

        <button class="btn btn-primary btn-block" type="submit">保存新密码</button>
    </form>
</section>
{% endblock %}
