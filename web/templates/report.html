{% extends "base.html" %}
{% block title %}FakeNgin · 检测报告{% endblock %}
{% block content %}
<a class="btn btn-sm" href="{{ url_for('main.history') }}">返回检测历史</a>
{% if record %}<section class="panel"><h1>检测报告</h1><p>{{ record.created_at }} · 报告编号 {{ record.id }}</p><h2>分析原文</h2><p style="white-space:pre-wrap;overflow-wrap:anywhere">{{ record.message }}</p></section>{% endif %}
{% include "_detect_result.html" %}
{% endblock %}
{% block scripts %}<script src="{{ url_for('static', filename='js/report.js') }}" defer></script>{% endblock %}
